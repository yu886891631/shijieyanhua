---
SocialCircle_Update_Rules:
  type: |-
    {
      [圈子名称: string]: {
        性质: string;
        互动频率: string;
        信息范围: string;
        社群人脉: string;
        活跃角色: string;
        关联团体: string;
        关联圈交集: string;
        当前动态: string;
        描述: string;
      }
    }
  check:
    - 仅维护当前叙事阶段仍在持续运作、能稳定影响角色生活或信息流通的社交圈
    - 顶层根路径固定为 `/社交圈`
    - 允许新建圈子键；新圈子必须以完整条目 insert 到 `/社交圈/圈子名称`
    - 已有圈子字段更新才使用 replace；禁止用 replace 冒充新建圈子
    - 删除废弃圈子时使用 remove；改名时使用 move
    - 多值字段 `社群人脉`、`活跃角色`、`关联圈交集` 统一为 string，使用全角/半角顿号串联，禁止输出 JSON array
    - 维护总数建议 ≤ 10；超出时优先移除已脱离当前叙事、长期无动态、与本轮不在场核心活跃角色最终名单列表无交集的圈子
  ${圈子名称}:
    性质:
      format: 家族血缘 | 地缘 | 业缘 | 趣缘 | 信仰 | 集市 | 黑市 | 学术 | 宫廷 | 军旅 等
      check:
        - 该圈子的主要联结基础，只写最核心的一类；若为复合型，以当前最主导者为准
    互动频率:
      check:
        - 成员往来的常见频率与节律，如日常、每周数次、逢集日、逢节庆、季节性往返
    信息范围:
      check:
        - 该圈通常能获知的信息层级与方向，如市井流言、码头排班、行会内幕、官场风向、地下交易
    社群人脉:
      check:
        - 该圈内稳定活跃、可被再次提及的背景集群成员，使用 `、`串联人群专名，不写具体人物姓名
    活跃角色:
      check:
        - 该圈内活跃的人物全名，使用 `、` 串联
        - 必须按世界背景的命名风格写人物全名，禁止使用别称、外号
    关联团体:
      check:
        - 若与正式组织、帮会、教派、家族、商会存在稳定交叉，则写团体专名；无则写 `无`
    关联圈交集:
      check:
        - 当前与之存在稳定人际往来或成员重叠的其他社交圈名称；无则写 `无`
        - 用于表现复合关系网络，不写一次性偶遇对象
    当前动态:
      check:
        - 记录该社群近期正在推进或酝酿的共同事务，优先写可复用的日常往来与安排
        - 应写具体事项，如节庆筹备、行会例会、集市换季、学徒出师、邻里互助、商议改道等
    描述:
      check:
        - 至少 50 字详述
        - 说明圈内关系网、惯例、活跃角色起到的作用，以及该圈如何影响角色生活、行动机会与信息获取
        - 若存在 `关联圈交集`，应说明重叠人物、利益链条与现实影响
    check:
      - 每个社交圈都应是“可复用的人际网络单元”，不是单次事件或临时场面
      - 键名 `圈子名称` 必须可复用、可检索，禁止使用过长整句作键名
